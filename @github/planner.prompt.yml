name: DeepCritical Planner Prompts
description: Concise prompt templates for workflow planning and strategy creation with configurable depth and style parameters
model: anthropic:claude-sonnet-4-0
modelParameters:
  temperature: 0.7
  max_tokens: 2048
messages:
  - role: system
    content: |
      You are a strategic planner for DeepCritical workflows. Your role is to create effective plans and strategies for complex tasks.

      **Planning Capabilities:**
      - Workflow planning with structured approaches
      - Strategy creation for diverse task types
      - Configurable planning depth and detail level
      - Concise or detailed planning styles
      - Multi-step process decomposition

      **Configuration:**
      - Style: concise (focused, brief planning)
      - Max depth: 3 (planning levels deep)
      - Adaptive to task complexity and requirements

      Focus on:
      - Breaking down complex tasks into manageable steps
      - Identifying dependencies and critical paths
      - Resource allocation and timeline estimation
      - Risk assessment and mitigation strategies
      - Success criteria and evaluation metrics
  - role: user
    content: |
      Create strategic plan for complex task or workflow.

      Task description: {{task_description}}
      Planning style: {{planning_style}}
      Maximum depth: {{max_depth}}
      Output format: {{output_format}}

      Planning requirements:
      1. **Task Analysis**: Understand the core objectives and requirements
      2. **Decomposition**: Break into logical, manageable components
      3. **Dependency Mapping**: Identify relationships between components
      4. **Resource Planning**: Allocate necessary resources and tools
      5. **Timeline Estimation**: Provide realistic timeframes for completion
      6. **Risk Assessment**: Identify potential obstacles and mitigation strategies
      7. **Success Metrics**: Define clear criteria for evaluating outcomes

      Planning approach:
      - **Concise Style**: Focus on essential steps, brief descriptions, key dependencies
      - **Detailed Style**: Comprehensive breakdown, thorough analysis, extensive documentation
      - **Depth Control**: Limit planning levels based on complexity and requirements
      - **Flexibility**: Adapt planning approach to task characteristics

      Generate strategic plan that provides clear direction, manageable steps, and realistic expectations for successful task completion.
testData:
  - input: |
      Task: "Develop machine learning model for customer churn prediction"
      Style: concise
      Max depth: 3
    expected: |
      **Strategic Plan:**
      1. **Data Preparation** (Week 1): Collect and clean customer data, handle missing values
      2. **Feature Engineering** (Week 2): Create relevant features, perform exploratory analysis
      3. **Model Development** (Week 3): Train multiple algorithms, tune hyperparameters
      4. **Evaluation & Deployment** (Week 4): Validate performance, deploy to production

      **Key Dependencies:** Data quality → Feature engineering → Model training → Validation
      **Risk Mitigation:** Data privacy compliance, model interpretability requirements
      **Success Criteria:** >85% accuracy, <10% false positive rate, production deployment
  - input: |
      Task: "Research emerging technologies in biotechnology"
      Style: detailed
      Max depth: 4
    expected: |
      **Comprehensive Research Strategy:**

      **Phase 1: Foundation Building**
      1.1 Literature Review: Survey academic papers, identify key research areas
      1.2 Expert Consultation: Interview leading researchers, attend conferences
      1.3 Trend Analysis: Analyze patent filings, funding patterns, publication trends

      **Phase 2: Technology Assessment**
      2.1 CRISPR Applications: Gene editing techniques, therapeutic developments
      2.2 Synthetic Biology: DNA synthesis, circuit design, metabolic engineering
      2.3 Nanotechnology: Drug delivery systems, diagnostic tools, biomaterials

      **Phase 3: Impact Analysis**
      3.1 Market Assessment: Commercialization potential, investment opportunities
      3.2 Regulatory Landscape: FDA approvals, ethical considerations, safety protocols
      3.3 Societal Impact: Healthcare accessibility, environmental effects, equity concerns

      **Phase 4: Strategic Recommendations**
      4.1 Investment Priorities: High-potential technologies, timing considerations
      4.2 Partnership Opportunities: Academic-industry collaborations, startup ecosystems
      4.3 Risk Management: Technology readiness, competitive landscape, regulatory hurdles

      **Timeline:** 12-16 weeks total, **Resources:** Research team, academic access, industry experts
      **Success Metrics:** Comprehensive technology roadmap, actionable investment recommendations
evaluators:
  - name: Planning strategy quality
    string:
      containsAll:
        - "task decomposition"
        - "dependency mapping"
        - "resource allocation"
        - "timeline estimation"
        - "risk assessment"
        - "success criteria"
  - name: Style adaptability
    string:
      containsAll:
        - "concise vs detailed"
        - "depth control"
        - "format flexibility"
        - "requirement matching"
        - "output customization"
  - name: Strategic value
    string:
      containsAll:
        - "actionable steps"
        - "realistic expectations"
        - "comprehensive coverage"
        - "implementation guidance"
        - "evaluation framework"
