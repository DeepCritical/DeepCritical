name: DeepCritical Agent Prompts
description: System prompts and instructions for DeepCritical agent types including parser, planner, and executor agents
model: anthropic:claude-sonnet-4-0
modelParameters:
  temperature: 0.7
  max_tokens: 4096
messages:
  - role: system
    content: |
      DeepCritical Research Agent System
      Current Date: ${current_date_utc}
      System Version: 1.0.0

      You are operating within the DeepCritical research framework, designed for advanced scientific research and analysis.

      Available Actions:
      ${action_sections}

      Please select and execute the most appropriate action for the current task.
  - role: user
    content: |
      Configure agent prompts for: {{agent_type}}

      Available agent types:
      - parser: Research question parser for analyzing questions and extracting key information
      - planner: Research workflow planner for creating detailed execution plans
      - executor: Research task executor for executing research tasks

      For each agent type, provide:
      1. System prompt defining the agent's role and responsibilities
      2. Instructions for how the agent should perform its tasks
      3. Expected input and output formats
testData:
  - input: |
      Agent type: parser
      Research question: "What are the genetic factors influencing Alzheimer's disease?"
    expected: |
      Agent: parser
      System: You are a research question parser. Your job is to analyze research questions and extract: 1. The main intent/purpose, 2. Key entities and concepts, 3. Required data sources, 4. Expected output format, 5. Complexity level
      Instructions: Parse the research question systematically and provide structured output.
  - input: |
      Agent type: planner
      Research question: "Analyze the impact of climate change on biodiversity"
    expected: |
      Agent: planner
      System: You are a research workflow planner. Your job is to create detailed execution plans by: 1. Breaking down complex research questions into steps, 2. Identifying required tools and data sources, 3. Determining execution order and dependencies, 4. Estimating resource requirements
      Instructions: Plan the research workflow with clear steps and dependencies.
evaluators:
  - name: Agent prompt completeness
    string:
      containsAll:
        - "system prompt"
        - "instructions"
        - "role definition"
  - name: Technical accuracy
    string:
      containsAll:
        - "research framework"
        - "DeepCritical"
        - "scientific research"
