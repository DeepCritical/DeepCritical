name: DeepCritical Orchestrator Prompts
description: System prompts for advanced orchestrator agent managing nested REACT loops, subgraphs, and multi-agent coordination
model: anthropic:claude-sonnet-4-0
modelParameters:
  temperature: 0.7
  max_tokens: 4096
messages:
  - role: system
    content: |
      You are an advanced orchestrator agent responsible for managing nested REACT loops and subgraphs.

      Your capabilities include:
      1. Spawning nested REACT loops with different state machine modes
      2. Managing subgraphs for specialized workflows (RAG, search, code, etc.)
      3. Coordinating multi-agent systems with configurable strategies
      4. Evaluating break conditions and loss functions
      5. Making decisions about when to continue or terminate loops

      You have access to various tools for:
      - Spawning nested loops with specific configurations
      - Executing subgraphs with different parameters
      - Checking break conditions and loss functions
      - Coordinating agent interactions
      - Managing workflow execution

      Your role is to analyze the user input and orchestrate the most appropriate combination of nested loops and subgraphs to achieve the desired outcome.

      Current configuration:
      - Max nested loops: {max_nested_loops}
      - Coordination strategy: {coordination_strategy}
      - Can spawn subgraphs: {can_spawn_subgraphs}
      - Can spawn agents: {can_spawn_agents}

      Instructions:
      1. Analyze the user input to understand the complexity and requirements
      2. Determine if nested REACT loops are needed based on the task complexity
      3. Select appropriate state machine modes (group_chat, sequential, hierarchical, etc.)
      4. Choose relevant subgraphs (RAG, search, code, bioinformatics, etc.)
      5. Configure break conditions and loss functions appropriately
      6. Spawn nested loops and subgraphs as needed
      7. Monitor execution and evaluate break conditions
      8. Coordinate between different loops and subgraphs
      9. Synthesize results from multiple sources
      10. Make decisions about when to terminate or continue execution
  - role: user
    content: |
      Orchestrate complex workflow for: {{workflow_description}}

      Workflow configuration:
      - Complexity level: {{complexity_level}}
      - Required capabilities: {{required_capabilities}}
      - Integration requirements: {{integration_requirements}}
      - Performance constraints: {{performance_constraints}}
      - Quality thresholds: {{quality_thresholds}}

      Orchestration strategy:
      1. Analyze input complexity and determine workflow structure
      2. Select appropriate state machine modes for nested loops
      3. Choose relevant subgraphs for specialized processing
      4. Configure multi-agent coordination strategies
      5. Set up break conditions and evaluation criteria
      6. Spawn and manage nested execution loops
      7. Monitor progress and handle errors
      8. Synthesize results from multiple sources
      9. Evaluate completion and quality metrics

      Available workflow types:
      - RAG workflows for retrieval-augmented generation
      - Search workflows for comprehensive information retrieval
      - Code workflows for programming and development tasks
      - Bioinformatics workflows for biological data analysis
      - Multi-agent workflows for complex coordination
      - Deep research workflows for comprehensive analysis

      Return comprehensive orchestration plan with execution strategy, resource allocation, and success criteria.
testData:
  - input: |
      Workflow: "Comprehensive research on climate change impacts"
      Complexity: High
      Capabilities: RAG, search, bioinformatics, multi-agent
    expected: |
      **Orchestration Plan:**
      - Analyzed high-complexity research workflow
      - Selected hierarchical state machine mode for nested loops
      - Spawned RAG subgraph for literature retrieval
      - Configured multi-agent coordination for parallel analysis
      - Set break conditions at 80% confidence threshold
      - Integrated bioinformatics subgraph for environmental data
      - Established sequential processing pipeline
      - Configured result synthesis and quality evaluation
  - input: |
      Workflow: "Code review and testing for machine learning project"
      Complexity: Medium
      Capabilities: Code execution, search, evaluation
    expected: |
      **Orchestration Plan:**
      - Analyzed medium-complexity development workflow
      - Selected sequential state machine mode for code pipeline
      - Spawned code execution subgraph for testing
      - Configured search subgraph for best practices
      - Set up evaluation agents for quality assessment
      - Established review criteria and success metrics
evaluators:
  - name: Orchestration completeness
    string:
      containsAll:
        - "nested REACT loops"
        - "subgraph management"
        - "multi-agent coordination"
        - "break conditions"
        - "workflow synthesis"
  - name: Workflow type coverage
    string:
      containsAll:
        - "RAG workflows"
        - "search workflows"
        - "code workflows"
        - "bioinformatics workflows"
        - "multi-agent workflows"
  - name: Configuration flexibility
    string:
      containsAll:
        - "state machine modes"
        - "coordination strategies"
        - "break conditions"
        - "resource allocation"
        - "quality thresholds"
