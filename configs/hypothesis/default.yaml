# Hypothesis engine configuration

mode: generate
max_hypotheses: 4
top_k: 3
evidence_mode: search_only
live_evidence_enabled: false
require_reasoning: true
generate_testing_plans: false
output_format: markdown

score_weights:
  novelty: 0.2
  evidence_support: 0.3
  testability: 0.2
  falsifiability: 0.15
  specificity: 0.15
