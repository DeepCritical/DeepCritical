# @package _group_
simulation:
  backend: "openmm"
  default:
    temperature_K: 300.0
    pressure_atm: 1.0
    timestep_fs: 2.0
    n_steps: 50000
    platform: "CPU"
    solvent_model: "amber/tip3p_standard.xml"
    forcefield: "amber/protein.ff14SB.xml"
    save_trajectory: true
    trajectory_format: "dcd"
    report_interval: 1000
